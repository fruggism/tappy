<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Percorsi relativi: dentro l'hub l'app vive in una sottocartella, e un
         percorso assoluto cercherebbe i file nella radice del sito. -->
    <link rel="icon" type="image/svg+xml" href="./icona.svg" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- `maximum-scale` e `user-scalable=no` tolgono lo zoom della pagina dove
         il browser li rispetta (Android). Safari li ignora di proposito: lì ci
         pensa lib/zoom.ts, annullando i gesti fuori dalla mappa. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- L'app gestisce chiaro/scuro da sé (AppContext); questi meta tag partono coerenti con
         il sistema e vengono aggiornati a runtime così la barra di stato/notch dell'iPhone
         segue sempre il colore di sfondo effettivo dell'app, mai bianco su sfondo scuro o
         viceversa. -->
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- NON rimettere "black-translucent": con quello iOS accorcia il viewport
         dell'altezza della status bar (793 invece di 852 su iPhone 15) ma
         continua a disegnarlo da y=0, e i 59px avanzati restano in fondo,
         irraggiungibili. La pulsantiera, ancorata al fondo del viewport,
         galleggiava lì sopra: misurato sul dispositivo il 2026-09-03. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>tappy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
