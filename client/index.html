<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- Percorsi relativi: dentro l'hub l'app vive in una sottocartella, e un
         percorso assoluto cercherebbe i file nella radice del sito. -->
    <link rel="icon" type="image/svg+xml" href="./icona.svg" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="manifest" href="./manifest.json" />
    <!-- `maximum-scale` e `user-scalable=no` tolgono lo zoom della pagina dove
         il browser li rispetta (Android). Safari li ignora di proposito: lì ci
         pensa lib/zoom.ts, annullando i gesti fuori dalla mappa. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- L'app gestisce chiaro/scuro da sé (AppContext); questi meta tag partono coerenti con
         il sistema e vengono aggiornati a runtime così la barra di stato/notch dell'iPhone
         segue sempre il colore di sfondo effettivo dell'app, mai bianco su sfondo scuro o
         viceversa. -->
    <!-- Un solo theme-color, senza media query: lo riempie lo script qui
         sotto col tema che l'utente ha davvero scelto. Con due meta legati a
         prefers-color-scheme vinceva il tema di **sistema**, e su un iPhone
         in scuro con l'app in chiaro la status bar restava nera sopra una
         schermata bianca. -->
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // Gira prima che la pagina venga dipinta: iOS decide qui il colore
      // della status bar, e React arriva troppo tardi. Legge il tema salvato
      // da AppContext; senza, ricade su quello di sistema.
      (function () {
        var scelto;
        try {
          scelto = localStorage.getItem("tappy_tema");
        } catch (e) {
          scelto = null;
        }
        var scuro =
          scelto === "dark" ||
          (scelto !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", scuro);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", scuro ? "#000000" : "#f5f5f7");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- NON rimettere "black-translucent": con quello iOS accorcia il viewport
         dell'altezza della status bar (793 invece di 852 su iPhone 15) ma
         continua a disegnarlo da y=0, e i 59px avanzati restano in fondo,
         irraggiungibili. La pulsantiera, ancorata al fondo del viewport,
         galleggiava lì sopra: misurato sul dispositivo il 2026-09-03. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>tappy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
